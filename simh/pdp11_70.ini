; Minimal SimH configuration for a PDP-11/70, for use with pdp11gui's
; "Modified SimH over telnet" console (see ConsolePDP11SimHU.pas).
;
; pdp11gui does NOT talk to the simulated PDP-11 serial terminal
; (TTI/TTO). It drives the machine by sending EXAMINE/DEPOSIT/RUN/STEP/
; RESET commands straight to SimH's own "sim>" command interpreter, and
; expects that prompt immediately after connecting. That interpreter is
; reached by enabling SimH's remote console over Telnet (SET REMOTE
; TELNET=...) - attaching a device to a Telnet port would give the wrong
; thing (the simulated terminal, not "sim>").
;
; Usage:
;   pdp11 pdp11_70.ini
;
; Then in pdp11gui, choose "Modified SimH over telnet" and set
; host "localhost", port 4000.

set cpu 11/70
set cpu 4096K

; Remote console: gives Telnet clients the "sim>" prompt pdp11gui expects
set stdio telnet=4000

; Machine starts halted at the console; pdp11gui issues RESET/RUN itself
